name: Build VPN SOPR Gaming APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Initialize Android wrapper and organize project structure
        run: |
          flutter create --platforms=android --org com.vpnsopr --project-name vpn_sopr_gaming .
          mkdir -p lib/models lib/services lib/theme lib/screens android/app/src/main
          [ -f main.dart ] && mv -f main.dart lib/main.dart
          [ -f vpn_config.dart ] && mv -f vpn_config.dart lib/models/vpn_config.dart
          [ -f vpn_engine_service.dart ] && mv -f vpn_engine_service.dart lib/services/vpn_engine_service.dart
          [ -f dragon_theme.dart ] && mv -f dragon_theme.dart lib/theme/dragon_theme.dart
          [ -f dashboard_screen.dart ] && mv -f dashboard_screen.dart lib/screens/dashboard_screen.dart
          [ -f configs_screen.dart ] && mv -f configs_screen.dart lib/screens/configs_screen.dart
          [ -f logs_screen.dart ] && mv -f logs_screen.dart lib/screens/logs_screen.dart
          [ -f settings_screen.dart ] && mv -f settings_screen.dart lib/screens/settings_screen.dart
          [ -f AndroidManifest.xml ] && mv -f AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          [ -f gradle.properties ] && mv -f gradle.properties android/gradle.properties
          [ -f build.gradle ] && mv -f build.gradle android/app/build.gradle

      - name: Fix MainActivity package, compatibility, and Android SDK
        run: |
          mkdir -p android/app/src/main/kotlin/com/vpnsopr/gaming
          cat <<'KOTLIN' > android/app/src/main/kotlin/com/vpnsopr/gaming/MainActivity.kt
          package com.vpnsopr.gaming

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity()
          KOTLIN

          python3 - <<'EOF'
          import re, pathlib
          for p in pathlib.Path("lib").rglob("*.dart"):
              txt = p.read_text()
              txt = re.sub(r'\.withValues\(alpha:\s*([^)]+)\)', r'.withOpacity(\1)', txt)
              txt = txt.replace('CardThemeData(', 'CardTheme(')
              txt = txt.replace('final WireGuardFlutterInterface _wireGuard = WireGuardFlutter.instance;', 'final _wireGuard = WireGuardFlutter.instance;')
              p.write_text(txt)

          main_p = pathlib.Path("lib/main.dart")
          if main_p.exists():
              m = main_p.read_text()
              m = m.replace("void main() async {", "void main() {")
              m = m.replace("await engine.initialize();", "Future.microtask(() => engine.initialize());")
              main_p.write_text(m)

          svc_p = pathlib.Path("lib/services/vpn_engine_service.dart")
          if svc_p.exists():
              s = svc_p.read_text()
              s = s.replace(
                  "await _v2ray.initializeV2Ray(\n      notificationIconResourceType: 'mipmap',\n      notificationIconResourceName: 'ic_launcher',\n    );",
                  "try {\n      await _v2ray.initializeV2Ray(\n        notificationIconResourceType: 'mipmap',\n        notificationIconResourceName: 'ic_launcher',\n      );\n    } catch (e) {\n      _addLog('V2Ray init error: $e');\n    }"
              )
              s = s.replace(
                  "await _openVpn.initialize(\n      groupIdentifier: 'group.com.vpnsopr.gaming',\n      providerBundleIdentifier: 'com.vpnsopr.gaming.VPNExtension',\n      localizedDescription: 'VPN SOPR Gaming',\n    );",
                  "try {\n      await _openVpn.initialize(\n        groupIdentifier: 'group.com.vpnsopr.gaming',\n        providerBundleIdentifier: 'com.vpnsopr.gaming.VPNExtension',\n        localizedDescription: 'VPN SOPR Gaming',\n      );\n    } catch (e) {\n      _addLog('OpenVPN init error: $e');\n    }"
              )
              s = s.replace(
                  "await _wireGuard.initialize(interfaceName: 'wg_sopr0');",
                  "try {\n      await _wireGuard.initialize(interfaceName: 'wg_sopr0');\n    } catch (e) {\n      _addLog('WireGuard init error: $e');\n    }"
              )
              svc_p.write_text(s)

          for p in [pathlib.Path("android/app/build.gradle"), pathlib.Path("android/app/build.gradle.kts")]:
              if p.exists():
                  txt = p.read_text()
                  txt = re.sub(r'(minSdk(?:Version)?\s*=?\s*)(?:flutter\.minSdkVersion|\d+)', r'\g<1>24', txt)
                  txt = re.sub(r'(compileSdk(?:Version)?\s*=?\s*)(?:flutter\.compileSdkVersion|\d+)', r'\g<1>35', txt)
                  p.write_text(txt)
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vpn-sopr-gaming-apks
          path: build/app/outputs/flutter-apk/*.apk
          
