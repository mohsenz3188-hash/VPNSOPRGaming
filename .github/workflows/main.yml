name: Build VPN SOPR Gaming APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Generate missing Android wrapper files if needed
        run: flutter create --platforms=android --org com.vpnsopr --project-name vpn_sopr_gaming .

      - name: Force Android minSdk 24 and compileSdk 35
        run: |
          python3 - <<'EOF'
          import re, pathlib
          for p in [pathlib.Path("android/app/build.gradle"), pathlib.Path("android/app/build.gradle.kts")]:
              if p.exists():
                  txt = p.read_text()
                  txt = re.sub(r'(minSdk(?:Version)?\s*=?\s*)(?:flutter\.minSdkVersion|\d+)', r'\g<1>24', txt)
                  txt = re.sub(r'(compileSdk(?:Version)?\s*=?\s*)(?:flutter\.compileSdkVersion|\d+)', r'\g<1>35', txt)
                  p.write_text(txt)
                  print("Patched", p)
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vpn-sopr-gaming-apks
          path: build/app/outputs/flutter-apk/*.apk
          
